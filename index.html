<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#131816">
  <meta name="description" content="3文字の暗号でダイヤル錠を解錠するアプリ">
  <title>REQUIEⅢ｜ダイヤル錠</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="brand">REQUIE<span>Ⅲ</span><small>SHUTTERLAND</small></div>
      <div class="plate">CODE LOCK · 03</div>
    </header>

    <section class="puzzle" aria-labelledby="title">
      <p class="eyebrow">LOCKED DEVICE</p>
      <h1 id="title">ダイヤル式の錠が<br>かかっている。</h1>
      <p class="instruction">3つの文字盤をタップし、暗号を入力せよ。</p>

      <div class="lock" id="lock">
        <div class="shackle" aria-hidden="true"><div></div></div>
        <div class="lock-body">
          <div class="screws" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="dials" id="dials" aria-label="3文字の暗号入力"></div>
          <div class="lock-line" aria-hidden="true"></div>
          <p class="attempts" id="attempts">回答できる回数　<span>3</span> / 3</p>
        </div>
      </div>

      <button class="unlock" id="unlock" type="button">
        <span>解錠を試みる</span><span aria-hidden="true">→</span>
      </button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <button class="reset" id="reset-failed" type="button" hidden>最初からやり直す</button>
    </section>

    <footer><span>REQUIEⅢ</span><span>THREE ATTEMPTS ONLY</span></footer>
  </main>

  <div class="result" id="result" hidden role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="result-card">
      <div class="result-symbol" aria-hidden="true">◇</div>
      <p class="eyebrow">UNLOCKED</p>
      <h2 id="result-title">解錠できました</h2>
      <p>錠が静かに外れた。</p>
      <button class="reset result-reset" id="reset-solved" type="button">最初からやり直す</button>
    </div>
  </div>
</body>
</html>
